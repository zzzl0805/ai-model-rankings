name: 每日数据更新

# 每天自动抓取 LMArena + Agent + 国产定价 → 构建 rankings.js → 发布到 GitHub Pages
# 微信云函数 syncRankings（每日定时触发器）会从 Pages 拉取并上传到云存储，
# 用户端小程序启动时自动拉到最新数据，无需重新发布小程序。
#
# 说明：
#   - 数据源：优先爬 arena.ai；被 Cloudflare 拦截时自动回退 LMArena 官方
#     HuggingFace 数据集（见 pipeline/fetch_lmarena_hf.py）
#   - 若两条路都失败，workflow 会跳过发布，线上保持上一次的数据不动
#   - 可随时在 Actions 页手动触发（workflow_dispatch）
#   - 时区：cron 为 UTC。每天 18:00 UTC = 次日 02:00 北京时间，
#     云函数触发器配置为每天 03:00（北京时间）拉取，留有 1 小时缓冲。

on:
  schedule:
    - cron: '0 18 * * *'          # 每天 18:00 UTC（北京时间次日 02:00）
  workflow_dispatch:               # 手动触发
  push:
    branches: [main]              # 首次部署 Pages 需要一次 push

permissions:
  contents: write   # 需要推送到 data 分支（供 jsDelivr 分发）
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  update-data:
    runs-on: ubuntu-latest
    env:
      # 让 pipeline 里的 puppeteer-core 找到 CI 装的 Chrome
      CHROME_PATH: /usr/bin/google-chrome
      # 统一用北京时间：cron 在 UTC 18:00（北京次日 02:00）触发，
      # 若用 UTC 日期打 tag / 写 lastUpdated，数据会被标成前一天，
      # 云端按北京日期取 tag 时就找不到「今天」的数据。
      TZ: Asia/Shanghai

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: pipeline/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装 Python 依赖
        run: cd pipeline && pip install -r requirements.txt

      - name: 安装 Node 依赖
        run: cd pipeline && npm ci

      - name: 安装 Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends google-chrome-stable
          google-chrome --version

      - name: 抓取并构建数据（update.sh）
        # 抓取失败不阻断：回退用仓库已提交的 rankings.js，保证 Pages 总有数据可发布
        # 日志同时写到 pipeline/update.log，便于排查（会随数据一起推到 data 分支）
        run: |
          cd pipeline
          set +e
          bash update.sh 2>&1 | tee update.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            echo "SCRAPE_FAILED=true" >> "$GITHUB_ENV"
            echo "::warning::update.sh 退出码 $rc，将发布仓库中上次构建的数据"
          fi
          exit 0

      - name: 提示抓取失败（可选）
        if: env.SCRAPE_FAILED == 'true'
        run: echo "::warning::本次抓取失败，将发布仓库中上次构建的数据"

      - name: 校验数据完整性
        run: |
          node -e "
          const d=require('./miniprogram/data/rankings.js');
          const cats=Object.keys(d.data||{});
          const total=Object.values(d.data||{}).reduce((s,c)=>s+Object.values(c).reduce((a,v)=>a+v.length,0),0);
          console.log('lastUpdated='+d.lastUpdated, '| 大类='+cats.length, '| 条目='+total);
          if(!cats.length || total < 500){ console.error('❌ 数据不完整，拒绝发布'); process.exit(1); }
          "

      - name: 生成云端发布文件（与 admin 上传格式一致）
        run: |
          mkdir -p dist
          node -e "const fs=require('fs');const d=require('./miniprogram/data/rankings.js');fs.writeFileSync('dist/rankings.json',JSON.stringify(d));"
          ls -la dist/rankings.json

      # 微信云函数在境内，访问 GitHub Pages 会超时；改走 jsDelivr 镜像仓库文件。
      # 用独立的 data 分支（每次强推单个提交），避免主分支历史被 900KB/天 撑爆。
      - name: 发布数据到 data 分支（供 jsDelivr 分发）
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "$RUNNER_TEMP"
          git clone --quiet --depth 1 "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" datarepo
          cd datarepo
          git checkout --orphan data
          git rm -rf . > /dev/null 2>&1 || true
          cp "$GITHUB_WORKSPACE/dist/rankings.json" rankings.json
          git add rankings.json
          # 附带本次运行日志，便于排查抓取问题
          if [ -f "$GITHUB_WORKSPACE/pipeline/update.log" ]; then
            cp "$GITHUB_WORKSPACE/pipeline/update.log" update.log
            git add update.log
          fi
          git -c user.name="github-actions[bot]" -c user.email="github-actions[bot]@users.noreply.github.com" \
              commit -m "data: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push -f origin data
          # 打日期 tag：云函数按 tag 取数，tag 不可变 → 天然绕开 CDN 缓存。
          # 用北京时间日期（TZ=Asia/Shanghai），与用户看到的「数据截至」一致。
          DATE=$(date +%Y-%m-%d)
          git tag -f "v$DATE"
          git push -f origin "refs/tags/v$DATE"
          echo "已推送 data 分支与 tag v$DATE"

      - name: 刷新 jsDelivr 缓存
        # 推送后 GitHub 需要几秒才把新提交同步给 jsDelivr，
        # 立刻 purge 会把「旧内容」重新缓存 12 小时。所以先等待，再 purge 两次。
        run: |
          echo "等待 GitHub 提交同步到 CDN 源站..."
          sleep 25
          for i in 1 2; do
            curl -s --max-time 30 "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@data/rankings.json" > /dev/null || true
            echo "第 $i 次 purge 完成"
            sleep 10
          done
          # 验证缓存是否已更新到今天的数据
          TODAY=$(date +%Y-%m-%d)
          for i in 1 2 3; do
            d=$(curl -s --max-time 60 "https://cdn.jsdelivr.net/gh/${GITHUB_REPOSITORY}@data/rankings.json" | head -c 80)
            echo "CDN 返回: $d"
            case "$d" in
              *"lastUpdated\":\"$TODAY"*) echo "✅ CDN 已更新到 $TODAY"; break;;
              *) echo "⚠️ 第 $i 次检查：仍为旧缓存"; sleep 15;;
            esac
          done

      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v5

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: 部署 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
